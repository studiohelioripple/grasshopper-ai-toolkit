[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grasshopper-toolkit"
version = "0.2.0"
description = "Zero-dependency Python library, CLI, and Agent Skill for inspecting, converting, and synthesizing Rhino Grasshopper (.gh / .ghx) definitions with deep Heteroptera plugin integration."
readme = "README.md"
authors = [
    { name = "Amen", email = "amen@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "grasshopper",
    "rhino3d",
    "computational-design",
    "parametric-architecture",
    "space-syntax",
    "heteroptera",
    "algorithmic-design",
    "gh-io"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
gh-toolkit = "gh_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/studiohelioripple/grasshopper-ai-toolkit"
Repository = "https://github.com/studiohelioripple/grasshopper-ai-toolkit.git"
"Bug Tracker" = "https://github.com/studiohelioripple/grasshopper-ai-toolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gh_toolkit*"]
